  <rect width="720" height="250" rx="26" fill="url(#background)"/>
  <rect x="1" y="1" width="718" height="248" rx="25" fill="none" stroke="#cbd5e1" stroke-opacity="0.85"/>
  <circle cx="684" cy="12" r="118" fill="#38bdf8" fill-opacity="0.09"/>
